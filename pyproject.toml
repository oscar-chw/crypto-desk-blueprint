[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-desk-blueprint"
version = "0.1.0"
description = "Blueprint, building blocks and conformance tests for a crypto trading pipeline"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.16.10", "mypy==1.20.0", "pandas-stubs==3.0.5.260914", "scikit-learn>=1.4", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "conformance"]
addopts = "--strict-markers -p no:cacheprovider"
markers = [
    "infra: stage 00 conformance",
    "data: stage 01 conformance",
    "features: stage 02 conformance",
    "strategy: stage 03 conformance",
    "pricing: stage 04 conformance",
    "risk: stage 05 conformance",
    "portfolio: stage 06 conformance",
    "execution: stage 07 conformance",
    "validation: stage 08 conformance",
    "mutation: proves each conformance test can fail",
    "blocks: unit tests of the shared building blocks",
    "experiments: every evidence experiment in quick mode (same code path, small n)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["pipeline", "conformance"]

[[tool.mypy.overrides]]
# Test functions take pytest fixtures by name and return nothing; annotating each fixture adds no safety.
module = ["conformance.conftest", "conformance.test_mutants", "conformance.stages.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# A mutant star-imports the toy implementation and redefines one factory on purpose; that redefinition is the mutation.
module = ["conformance.mutants.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disable_error_code = ["no-redef", "attr-defined"]
